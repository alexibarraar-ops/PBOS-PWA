<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="application-name" content="PBOS">
  <meta name="apple-mobile-web-app-title" content="PBOS">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>PBOS</title>
  <style>
    :root{--bg:#0b0f18;--card:#121826;--txt:#fff;--muted:#98a2b3;--gold:#f6b21a;--line:#263043}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 18px 55px rgba(0,0,0,.35)}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.brand img{width:72px;height:72px;border-radius:18px}.brand h1{font-size:28px;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .status{padding:12px 14px;border-radius:14px;background:#0f1522;color:var(--muted);font-size:13px;line-height:1.4;margin-bottom:14px}
    label{display:block;font-size:12px;color:var(--muted);margin:14px 0 7px} input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid var(--line);background:#0c121d;color:#fff;font-size:14px;outline:none}
    button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:var(--gold);color:#111827}.secondary{background:#1c2535;color:#fff;border:1px solid var(--line)}
    .small{font-size:11px;color:var(--muted);line-height:1.45;margin-top:14px;text-align:center}.hidden{display:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="./icon.svg" alt="PBOS"><div><h1>PBOS</h1><p>Pizza Beat OS</p></div></div>
    <div id="status" class="status">Configurá una sola vez tu enlace personal de PBOS. Quedará guardado únicamente en este dispositivo.</div>
    <section id="setup"><label for="url">Tu enlace personal de PBOS</label><input id="url" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec?token=..."><button class="primary" onclick="guardarYAbrir()">Guardar y abrir PBOS</button></section>
    <section id="ready" class="hidden"><button class="primary" onclick="abrirPBOS()">Abrir PBOS</button><button class="secondary" onclick="cambiarEnlace()">Cambiar enlace</button></section>
    <div class="small">PBOS Launcher no guarda datos del negocio. Solo conserva localmente el enlace asignado a este teléfono.</div>
  </main>
<script>
  const KEY='PBOS_URL_V1';const input=document.getElementById('url');const setup=document.getElementById('setup');const ready=document.getElementById('ready');const status=document.getElementById('status');
  function urlValida(v){try{const u=new URL(v);return u.protocol==='https:'&&u.hostname.includes('script.google.com');}catch(e){return false;}}
  function iniciar(){const q=new URL(location.href).searchParams.get('pbos');if(q&&urlValida(q)){localStorage.setItem(KEY,q);history.replaceState({},'',location.pathname);}const v=localStorage.getItem(KEY)||'';if(v){setup.classList.add('hidden');ready.classList.remove('hidden');status.textContent='Dispositivo configurado. Tocá “Abrir PBOS”.';}else{setup.classList.remove('hidden');ready.classList.add('hidden');}}
  function guardarYAbrir(){const v=input.value.trim();if(!urlValida(v)){alert('Pegá el enlace completo de PBOS que te fue asignado.');return;}localStorage.setItem(KEY,v);location.href=v;}
  function abrirPBOS(){const v=localStorage.getItem(KEY)||'';if(!urlValida(v)){cambiarEnlace();return;}location.href=v;}
  function cambiarEnlace(){localStorage.removeItem(KEY);input.value='';iniciar();input.focus();}
  if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});} iniciar();
</script>
</body>
</html>
